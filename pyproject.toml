[project]
name = "coderetrieval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cocoindex[postgres]>=1.0.0,<2.0.0",
  "fastmcp>=2.0.0",
  "numpy>=1.26.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.1",
  "sentence-transformers>=3.0.0",
]

[project.scripts]
coderetrieval = "src.main:run"
